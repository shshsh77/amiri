<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход в AMIRI VAPE</title>
  <link rel="icon" href="/assets/amiri-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/login.js"></script>
</head>
<body class="gated">
  <main class="gate">
    <div class="gate-card">
      <div class="gate-content">
        <img class="gate-logo" src="/assets/amiri-logo.svg" width="64" height="64" alt="">
        <h1>Вход в <span class="gate-wordmark">AMIRI VAPE</span></h1>
        <p>Откройте бота и подтвердите код, чтобы войти в магазин.</p>
        <a class="gate-button" id="telegram-login" target="_blank" rel="noopener noreferrer" aria-disabled="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.4 4.2 2.9 11.3c-1.3.5-1.2 1.2-.2 1.5l4.7 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.5-1.5zM8.3 14l9.6-6c.5-.3.9-.1.5.2l-8 7.3-.3 3.4z"/></svg>
          Войти через Telegram
        </a>
        <div id="login-code" class="gate-code" hidden>Код входа <strong></strong></div>
        <div id="login-status" class="gate-status" role="status"></div>
        <button id="login-retry" class="gate-retry" type="button" hidden>Получить новую ссылку</button>
        <small id="bot-note" class="gate-note" hidden>Ещё не с нами? При первом входе вас зарегистрирует <a id="bot-link" target="_blank" rel="noopener noreferrer"></a>.</small>
      </div>
      <div class="gate-visual"><img src="/assets/amiri-logo.svg" width="527" height="536" alt=""></div>
    </div>
  </main>
</body>
</html>
